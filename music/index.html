<!doctype html>
<html lang="en" data-theme="system">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playlists | Maxwell Cofie</title>
    <meta name="description" content="Curated Apple Music playlists that soundtrack my work, late-night building, and daily life.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇭</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* FOUC fix for i18n */
        [data-i18n] {
            visibility: visible;
        }
    </style>
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Mansalva&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Open Graph / SEO -->
    <meta property="og:title" content="Playlists | Maxwell Cofie">
    <meta property="og:description" content="Curated Apple Music playlists by Maxwell Cofie.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maxwellcofie.com/music/">
</head>

<body>

    <nav>
        <a href="../" class="logo">Maxwell Cofie</a>
        <div class="nav-links">
            <a href="../work/" class="nav-link" data-i18n="nav.work">Work</a>
            <a href="../ventures/" class="nav-link" data-i18n="nav.ventures">Ventures</a>
            <a href="../writing/" class="nav-link" data-i18n="nav.writing">Logbook</a>
            <button class="theme-toggle" id="themeBtn" aria-label="Toggle Theme">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
                </svg>
            </button>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="fr">FR</button>
                <button class="lang-btn" data-lang="es">ES</button>
            </div>
        </div>
    </nav>

    <div class="intro">
        <p data-i18n="music.intro">A curated selection of playlists that soundtrack my work, late-night building, and daily life. Listen directly on Apple Music.</p>
    </div>

    <!-- Active Apple Music Embed Player -->
    <div class="music-player-container" id="playerContainer">
        <div class="music-player-header">
            <div class="now-playing-label">
                <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fa2d48;"></span>
                <span>Active Playlist</span>
            </div>
            <span class="active-playlist-name" id="activePlaylistTitle">Roots</span>
        </div>
        <div class="music-iframe-wrapper">
            <iframe id="musicIframe"
                allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
                frameborder="0"
                height="450"
                sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
                src="https://embed.music.apple.com/gh/playlist/roots/pl.u-4JomXNJtJj0lr5J">
            </iframe>
        </div>
    </div>

    <!-- Playlists Directory -->
    <div class="project-list-container">
        <div class="section-label" data-i18n="section.curated_playlists">Curated Playlists</div>
        <div id="playlistList" class="project-list"></div>
    </div>

    <footer>
        <a href="mailto:hello@maxwellcofie.com" class="footer-link" data-i18n="footer.email">Email</a>
        <a href="https://x.com/maxwellcofie" target="_blank" class="footer-link" data-i18n="footer.twitter">Twitter</a>
        <a href="https://linkedin.com/in/maxwell-cofie" target="_blank" class="footer-link"
            data-i18n="footer.linkedin">LinkedIn</a>
        <a href="https://thekompound.substack.com" target="_blank" class="footer-link" data-i18n="footer.substack">Substack</a>
        <a href="https://www.youtube.com/@maxwellcofie" target="_blank" class="footer-link" data-i18n="footer.youtube">YouTube</a>
        <span style="flex-grow: 1;"></span>
        <span class="footer-link" style="color: var(--text-tertiary); cursor: default;">&copy; 2026 Maxwell Cofie</span>
    </footer>

    <!-- Scripts -->
    <script src="../music-data.js"></script>
    <script src="../locale.js"></script>
    <script src="../app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playlists = window.playlists || [];
            if (!playlists.length) return;

            const container = document.getElementById('playlistList');
            const iframe = document.getElementById('musicIframe');
            const titleEl = document.getElementById('activePlaylistTitle');
            const playerContainer = document.getElementById('playerContainer');

            let currentActiveId = playlists[0].id;

            function renderPlaylists() {
                container.innerHTML = '';
                playlists.forEach((p, idx) => {
                    const item = document.createElement('div');
                    item.className = `project-item music-item ${p.id === currentActiveId ? 'active-item' : ''}`;
                    item.setAttribute('data-id', p.id);
                    item.style.animation = `slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) ${idx * 0.04}s forwards`;

                    item.innerHTML = `
                        <div class="proj-left">
                            <div class="proj-header">
                                <span class="proj-title">${p.title} <span class="year-label">(${p.songs} songs · ${p.duration})</span></span>
                                <span class="play-badge">▶</span>
                            </div>
                            <span class="proj-desc">${p.description}</span>
                        </div>
                        <div class="proj-meta">
                            <span class="music-genre-tag">${p.tag}</span>
                            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="apple-music-link" title="Open on Apple Music" onclick="event.stopPropagation();">
                                Apple Music ↗
                            </a>
                        </div>
                    `;

                    item.addEventListener('click', () => {
                        currentActiveId = p.id;
                        titleEl.textContent = p.title;
                        iframe.src = p.embedUrl;

                        document.querySelectorAll('.music-item').forEach(el => el.classList.remove('active-item'));
                        item.classList.add('active-item');

                        // Smooth scroll to player on mobile
                        if (window.innerWidth <= 600) {
                            playerContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    });

                    container.appendChild(item);
                });
            }

            renderPlaylists();
        });
    </script>
</body>

</html>
